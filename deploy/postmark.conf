<VirtualHost *:80>
    WSGIDaemonProcess postmark user=www-data group=www-data threads=5 python-path=/var/www/postmark
    WSGIProcessGroup postmark
    WSGIScriptAlias / /var/www/postmark/postmark.wsgi

    <Directory /var/www/postmark>
        <Files postmark.wsgi>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/postmark-error.log
    CustomLog ${APACHE_LOG_DIR}/postmark-access.log combined
</VirtualHost>
